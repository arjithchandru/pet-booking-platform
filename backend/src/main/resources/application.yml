server:
  port: 8080

spring:
  application:
    name: booking-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/petcare_db
    username: petcare_user
    password: petcare_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.petcare.booking: DEBUG