services:
  postgres:
    image: postgres:16-alpine
    container_name: petcare_postgres
    environment:
      POSTGRES_DB: petcare_db
      POSTGRES_USER: petcare_user
      POSTGRES_PASSWORD: petcare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare_user -d petcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: